# ─────────────────────────────────────────────────────────────────────────────
# RIS/PACS Frontend — nginx config (HTTPS)
# Servir SPA + proxy /api/* para o backend (DNS interno do compose).
# TLS: certificado montado em /etc/nginx/tls (self-signed no piloto LAN).
# Gerar o cert antes de subir: infra/tls/gen-cert.sh  (ver docs/plano-piloto.md).
# ─────────────────────────────────────────────────────────────────────────────

# HTTP → redireciona tudo para HTTPS.
server {
  listen 80;
  server_name _;
  # Healthcheck do container pode bater em HTTP (não redireciona).
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  root  /usr/share/nginx/html;
  index index.html;

  # Cabeçalhos de segurança (sem HSTS — cert self-signed no piloto LAN).
  add_header X-Content-Type-Options nosniff       always;
  add_header X-Frame-Options        SAMEORIGIN     always;
  add_header Referrer-Policy        no-referrer     always;

  # Compressão
  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_types      text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  # Cache forte pros assets (já têm hash no nome)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # PWA — manifest com mime correto; service worker sem cache (sempre atualiza)
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    try_files $uri =404;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Proxy /api/* → backend (nome do serviço no docker-compose)
  location /api/ {
    proxy_pass         http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Connection        "";

    # Streams de DICOM podem ser grandes — sem buffer + timeout generoso.
    proxy_buffering        off;
    proxy_request_buffering off;
    proxy_read_timeout     1800s;     # 30 min — uploads longos em rede lenta
    proxy_send_timeout     1800s;
    client_max_body_size   5G;        # cabe estudos grandes
    client_body_timeout    1800s;
  }

  # SPA fallback — qualquer rota não-arquivo cai no index.html (React Router)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Healthcheck
  location = /healthz {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
