<!--subject: Check-in confirmado — {{procedure.name}}-->
<!--preheader: Sua presença foi registrada. Acompanhe o status do exame em tempo real.-->

<h1 style="margin:0 0 16px;font-size:22px;font-weight:700;color:#0D0F14;">Check-in confirmado</h1>

<p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#36455A;">
  Olá, <strong>{{patient.name}}</strong>. Registramos sua presença na clínica para o exame
  de <strong>{{procedure.name}}</strong>.
</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:16px 0;background:#EAF6F2;border-left:3px solid #0D7A5A;border-radius:6px;">
  <tr><td style="padding:14px 18px;">
    <div style="font-size:11px;color:#0D7A5A;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;margin-bottom:4px;">Check-in realizado às</div>
    <div style="font-size:18px;font-weight:700;color:#0D0F14;font-family:'JetBrains Mono','Courier New',monospace;">{{appointment.checkin_time_br}}</div>
  </td></tr>
</table>

{{#room.name}}
<p style="margin:16px 0;font-size:14px;color:#51627A;line-height:1.6;">
  <strong>Sala:</strong> {{room.name}}<br>
  Por favor, aguarde ser chamado para o procedimento.
</p>
{{/room.name}}

<div style="margin:24px 0;text-align:center;">
  <a href="{{portal.status_url}}"
     style="display:inline-block;background:#0A7B93;color:#FFFFFF;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:600;font-size:14px;">
    Acompanhar status
  </a>
</div>
